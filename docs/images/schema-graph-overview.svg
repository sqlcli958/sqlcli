<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <style>
      .t{font:700 38px Arial,sans-serif;fill:#f8fafc}.s{font:400 18px Arial,sans-serif;fill:#cbd5e1}.h{font:700 21px Arial,sans-serif;fill:#f8fafc}.l{font:600 16px Arial,sans-serif;fill:#e2e8f0}.b{font:400 14px Arial,sans-serif;fill:#94a3b8}.c{font:600 13px Arial,sans-serif;fill:#dbeafe}
    </style>
  </defs>
  <rect width="1280" height="720" rx="24" fill="url(#bg)"/>
  <text x="70" y="80" class="t">sql-cli schema graph</text>
  <text x="70" y="112" class="s">Ground AI agents with database structure, business meaning, value domains and verified relations before SQL execution.</text>

  <g fill="#0f172a" stroke="#334155" stroke-width="2">
    <rect x="70" y="160" width="350" height="440" rx="24"/><rect x="465" y="160" width="350" height="440" rx="24"/><rect x="860" y="160" width="350" height="440" rx="24"/>
  </g>

  <text x="100" y="205" class="h">1. Import metadata</text>
  <text x="495" y="205" class="h">2. Add business semantics</text>
  <text x="890" y="205" class="h">3. Query with guardrails</text>

  <g fill="#111c31" stroke="#2b3a55">
    <rect x="100" y="240" width="290" height="86" rx="16"/><rect x="100" y="345" width="290" height="86" rx="16"/><rect x="100" y="450" width="290" height="112" rx="16"/>
    <rect x="495" y="240" width="290" height="86" rx="16"/><rect x="495" y="345" width="290" height="86" rx="16"/><rect x="495" y="450" width="290" height="112" rx="16"/>
    <rect x="890" y="240" width="290" height="86" rx="16"/><rect x="890" y="345" width="290" height="86" rx="16"/><rect x="890" y="450" width="290" height="112" rx="16"/>
  </g>

  <text x="122" y="271" class="l">Database schemas</text><text x="122" y="296" class="b">tables · columns · PK/FK · indexes</text><text x="122" y="316" class="b">MySQL · PostgreSQL · Oracle · ClickHouse</text>
  <text x="122" y="376" class="l">JDBC metadata import</text><text x="122" y="401" class="b">incremental merge + workspace snapshots</text>
  <text x="122" y="482" class="l">Graph workspace</text><text x="122" y="508" class="b">schemas · tables · terms · relations</text><text x="122" y="530" class="b">validation · changes · searchable context</text>

  <text x="517" y="271" class="l">Business context</text><text x="517" y="296" class="b">business names · descriptions · tags</text><text x="517" y="316" class="b">semantic types · value domains · examples</text>
  <text x="517" y="376" class="l">Verified relations</text><text x="517" y="401" class="b">foreign keys · observed joins · term mappings</text>
  <text x="517" y="482" class="l">Agent grounding</text><text x="517" y="508" class="b">find the right table, field and join path</text><text x="517" y="530" class="b">before generating or executing SQL</text>

  <text x="912" y="271" class="l">Read path</text><text x="912" y="296" class="b">schema search · describe · path · query</text>
  <text x="912" y="376" class="l">Write path</text><text x="912" y="401" class="b">preflight · approval · audit · recovery SQL</text>
  <text x="912" y="482" class="l">Closed loop</text><text x="912" y="508" class="b">query → learn → write back graph</text><text x="912" y="530" class="b">human review when required</text>

  <path d="M390 505 C430 505 450 505 485 505" stroke="#60a5fa" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M785 505 C825 505 845 505 880 505" stroke="#34d399" stroke-width="7" fill="none" stroke-linecap="round"/>

  <rect x="70" y="630" width="1140" height="48" rx="14" fill="#0b1220" stroke="#1e293b"/>
  <text x="95" y="660" class="c">ground → guard → approve &amp; audit → learn</text>
  <text x="365" y="660" class="b">The schema graph turns database metadata into reusable context for safer agent-driven development.</text>
</svg>