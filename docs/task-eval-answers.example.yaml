# 任务评估作答模板（sql-cli <alias> schema task-eval --cases <tasks.yaml> --answers <本文件>）
#
# 这里装的是 **agent 的产出**，不是答案。答案在 cases 文件的 expect 里。
#
# 谁来填：外部 harness（Claude Code）。sql-cli 不跑 agent——它只判分。
# 每个 case 起两个 agent，各跑一遍同一个 task，产出分别填进两组：
#   control  只给 sql-cli skill 和图谱（不给库、不给答案）
#   cheat    同上，外加把 cases 里这条的 expect.tables 抄给它（只藏 JOIN 和值域）
# 两组对照提供定位线索：control✗/cheat✓ 优先检查表定位；两组都失败仍无法确定原因。
# 报告的 level=plan 只检查声明，level=sql 检查实际 SQL；均不验证执行结果。
# 有 sql 时，tables/joins/values 的说明不能弥补实际 SQL 的错误；注释和字符串也不能充当过滤。
# SQL 检查当前支持单层 SELECT 的表、等值连接和 WHERE/HAVING 静态条件。
# CTE、子查询、集合运算、自关联、无法解析的判据返回 complete=false，不能当作通过。
# 需要验证业务数值时，外部 harness 必须在固定数据上执行，并比对预期结果。
#
# 每组字段：tables/joins/values 用于无 SQL 的计划检查；sql 存放实际作答。
# 期望写明 schema 时必须一致。带箭头的连接按等式检查，两端顺序可交换。
# 自然语言的业务解释不能替代可执行判据；SQL case 应把条件写成如 is_scan=1。
# 下方只演示静态检查，真实任务需补充时间边界等判据和结果验证。

answers:
  # 通过：对照组就做对了（作弊组可以省，归因只在失败时才需要它）
  scan-required-plans:
    control:
      tables:
        - erp_prop_task_plan
      joins: []
      sql: "SELECT id, title FROM erp_prop_task_plan WHERE is_scan = 1"
      values:
        erp_prop_task_plan.is_scan: "0=免扫码, 1=必须扫码；取 1"
    cheat:
      tables:
        - erp_prop_task_plan
      joins: []
      sql: "SELECT id, title FROM erp_prop_task_plan WHERE is_scan = 1"
      values:
        erp_prop_task_plan.is_scan: "0=免扫码, 1=必须扫码；取 1"

  # 图谱侧失败：对照组选错了表（配置态当执行态），给了正确表集合就做对了
  # → 说明图谱在「定位」这一环缺东西，补三张相似表的业务描述 / 术语
  inspect-completion-rate:
    control:
      tables:
        - erp_prop_task_plan
        - erp_prop_task_point
      joins:
        - "erp_prop_task_point.plan_id = erp_prop_task_plan.id"
      sql: "SELECT p.id, COUNT(*) FROM erp_prop_task_point tp JOIN erp_prop_task_plan p ON tp.plan_id = p.id GROUP BY p.id"
    cheat:
      tables:
        - erp_prop_task_plan
        - erp_prop_plan_point
      joins:
        - "erp_prop_plan_point.plan_id = erp_prop_task_plan.id"
      sql: |
        SELECT p.id,
               SUM(CASE WHEN pp.is_result = 1 THEN 1 ELSE 0 END) / COUNT(*) AS rate
        FROM erp_prop_plan_point pp
        JOIN erp_prop_task_plan p ON pp.plan_id = p.id
        GROUP BY p.id
      values:
        erp_prop_plan_point.is_result: "点位有没有做完"
