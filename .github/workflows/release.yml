name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v0.1.0 or v0.1.0-rc.1"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build release artifact
        run: mvn -B -ntp clean package

      - name: Prepare versioned artifact and checksum
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cp target/sql-cli.jar "target/sql-cli-${VERSION}.jar"
          sha256sum "target/sql-cli-${VERSION}.jar" > "target/sql-cli-${VERSION}.jar.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            "target/sql-cli-${VERSION}.jar" \
            "target/sql-cli-${VERSION}.jar.sha256" \
            --target "$GITHUB_SHA" \
            --title "sql-cli $VERSION" \
            --generate-notes
